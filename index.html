        const { useState, useEffect, useRef, Component } = React;

        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxvInMBqFNSbh4rg4BL5tod-CaiCB_oZV-k2blqrpJx4SvQekFXOTXOej2BF9m1ZEiZ/exec';

        const STATUSES = [
            { id: 1, label: 'รอออกแบบ', color: 'bg-yellow-100 text-yellow-800 border-yellow-300', icon: 'fa-clock' },

        const ROLES = [

            { id: 'graphic', label: 'กราฟฟิก (ออกแบบ / ตรวจไฟล์)', icon: 'fa-pen-nib' },

        const INITIAL_JOBS = [
            { id: 'JOB-101', customer: 'ร้านกาแฟสด Me Coffee', phone: '081-234-5678', dueDate: 'พรุ่งนี้ 15:00 น.', price: '450', details: 'ไวนิลหน้าเดียว 3x1.5 เมตร พับขอบตอกตาไก่ 4 มุม ขอโทนสีมินิมอล', status: 1, createdBy: 'แอน', date: new Date().toLocaleDateString('th-TH'), file: null, fileLink: DEFAULT_SHOP_DRIVE_URL, urgent: true, createdAt: Date.now() - 40000 },
            { id: 'JOB-102', customer: 'มินิมาร์ท 24 ชม. สาขา 2', phone: '089-999-8877', dueDate: '25 ต.ค.', price: '1,200', details: 'ป้ายฟิวเจอร์บอร์ด 60x80 ซม. จำนวน 5 แผ่น (โปรโมชั่นหน้าร้าน)', status: 2, createdBy: 'แอน', date: new Date().toLocaleDateString('th-TH'), file: null, fileLink: DEFAULT_SHOP_DRIVE_URL, urgent: false, createdAt: Date.now() - 30000 },
        ];

        // โค้ด Google Apps Script ฉบับอัปเกรด (รองรับทั้งเก็บไฟล์ลง Google Drive อัตโนมัติ และจำข้อมูลไฟล์แนบ)
        const GAS_CODE_TEMPLATE = `const SHEET_NAME = 'Jobs';
const DRIVE_FOLDER_ID = '${DRIVE_FOLDER_ID}'; // โฟลเดอร์ Google Drive ของร้าน

function doGet(e) {
  const sheet = getOrCreateSheet();
  const data = sheet.getDataRange().getValues();
  if (data.length <= 1) {
    return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
  }
  const headers = data[0];
  const jobs = data.slice(1).map(row => {
    let obj = {};
    headers.forEach((h, i) => {
      if (h === 'file' && row[i]) {
        try { obj[h] = JSON.parse(row[i]); } catch(err) { obj[h] = null; }
      } else {
        obj[h] = row[i];
      }
    });
    return obj;
  });
  return ContentService.createTextOutput(JSON.stringify(jobs)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  const payload = JSON.parse(e.postData.contents);
  const action = payload.action;
  const sheet = getOrCreateSheet();

  // กรณีอัปโหลดไฟล์เข้า Google Drive อัตโนมัติ
  if (action === 'uploadDrive') {
    try {
      const folder = DriveApp.getFolderById(DRIVE_FOLDER_ID);
      const blob = Utilities.newBlob(Utilities.base64Decode(payload.base64), payload.mimeType, payload.fileName);
      const file = folder.createFile(blob);
      file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
      return ContentService.createTextOutput(JSON.stringify({
        status: 'success',
        fileUrl: file.getUrl(),
        downloadUrl: 'https://drive.google.com/uc?export=download&id=' + file.getId(),
        fileName: file.getName()
      })).setMimeType(ContentService.MimeType.JSON);
    } catch (err) {
      return ContentService.createTextOutput(JSON.stringify({ status: 'error', message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
    }
  }

  const job = payload.job;
  const headers = ['id', 'customer', 'phone', 'dueDate', 'price', 'details', 'status', 'createdBy', 'date', 'fileLink', 'urgent', 'createdAt', 'file'];
  const data = sheet.getDataRange().getValues();

  if (action === 'update') {
    let rowIndex = -1;
    for (let i = 1; i < data.length; i++) {
      if (data[i][0] === job.id) { rowIndex = i + 1; break; }
    }
    const rowValues = headers.map(h => {
      if (h === 'file') return job.file ? JSON.stringify(job.file) : '';
      return job[h] !== undefined ? job[h] : '';
    });
    if (rowIndex > 0) {
      sheet.getRange(rowIndex, 1, 1, headers.length).setValues([rowValues]);
    } else {
      sheet.appendRow(rowValues);
    }
  } else if (action === 'delete') {
    for (let i = 1; i < data.length; i++) {
      if (data[i][0] === job.id) { sheet.deleteRow(i + 1); break; }
    }
  }
  return ContentService.createTextOutput(JSON.stringify({ status: 'ok' })).setMimeType(ContentService.MimeType.JSON);
}

function getOrCreateSheet() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sheet = ss.getSheetByName(SHEET_NAME);
  const headers = ['id', 'customer', 'phone', 'dueDate', 'price', 'details', 'status', 'createdBy', 'date', 'fileLink', 'urgent', 'createdAt', 'file'];
  if (!sheet) {
    sheet = ss.insertSheet(SHEET_NAME);
    sheet.appendRow(headers);
  } else {
    const firstRow = sheet.getRange(1, 1, 1, headers.length).getValues()[0];
    if (firstRow[12] !== 'file') {
      sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
    }
  }
  return sheet;
}`;

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("ErrorBoundary caught an error", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen bg-red-50 flex items-center justify-center p-6 text-center">
                            <div className="bg-white p-8 rounded-2xl shadow-xl border border-red-200 max-w-md w-full">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <i className="fas fa-triangle-exclamation text-2xl"></i>
                                </div>
                                <h2 className="text-xl font-bold text-gray-900 mb-2">ระบบเกิดข้อผิดพลาด</h2>
                                <p className="text-gray-600 text-sm mb-6 break-words">{this.state.error?.message || "เกิดข้อผิดพลาดในการแสดงผล"}</p>
                                <button onClick={() => window.location.reload()} className="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">
                                    โหลดหน้าเว็บใหม่อีกครั้ง
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        function App() {
            const [user, setUser] = useState(null);
            const [jobs, setJobs] = useState(INITIAL_JOBS);
            const [isCloudConnected, setIsCloudConnected] = useState(false);
            const [isLoadingCloud, setIsLoadingCloud] = useState(true);

            const [isAddingJob, setIsAddingJob] = useState(false);
            const [editingJob, setEditingJob] = useState(null);
            const [isSaving, setIsSaving] = useState(false);
            const [uploadingJobId, setUploadingJobId] = useState(null);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadStatusText, setUploadStatusText] = useState('');
            const [previewFile, setPreviewFile] = useState(null);
            const [printingJob, setPrintingJob] = useState(null);
            const [isSharingModalOpen, setIsSharingModalOpen] = useState(false);
            const [sharingTab, setSharingTab] = useState('cloud');
            
            const [gasUrlInput, setGasUrlInput] = useState(() => {
                try { return localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL; } catch (e) { return DEFAULT_GAS_URL; }
            });
            
            const [shopDriveUrl, setShopDriveUrl] = useState(DEFAULT_SHOP_DRIVE_URL);
            const [newJob, setNewJob] = useState({ customer: '', phone: '', dueDate: '', price: '', details: '', file: null, fileLink: DEFAULT_SHOP_DRIVE_URL, urgent: false });
            
            const [searchQuery, setSearchQuery] = useState('');
            const [statusFilter, setStatusFilter] = useState(null);
            const [confirmDeleteId, setConfirmDeleteId] = useState(null);
            const [rowFileErrors, setRowFileErrors] = useState({});
            const [toast, setToast] = useState(null);

            const importInputRef = useRef(null);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            // แปลงขนาดไฟล์ให้อ่านง่าย (MB / GB)
            const formatFileSize = (bytes) => {
                if (!bytes) return '';
                if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + ' GB';
                if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
                if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
                return bytes + ' B';
            };

            // แปลงข้อมูลไฟล์จาก Cloud/LocalStorage ให้พร้อมใช้งานเสมอ
            const parseFileField = (f) => {
                if (!f) return null;
                if (typeof f === 'object' && f.url) return f;
                if (typeof f === 'string') {
                    try {
                        const parsed = JSON.parse(f);
                        if (parsed && parsed.url) return parsed;
                    } catch (e) {}
                }
                return null;
            };

            // ระบบดึงข้อมูลจาก Google Sheets โดยไม่เขียนทับไฟล์แนบที่มีอยู่
            useEffect(() => {
                let intervalId = null;

                const fetchFromSheets = async (url) => {
                    try {
                        const response = await fetch(url);
                        const fetchedJobs = await response.json();
                        if (Array.isArray(fetchedJobs) && fetchedJobs.length > 0) {
                            fetchedJobs.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                            
                            setJobs(prevJobs => {
                                return fetchedJobs.map(cloudJob => {
                                    const localMatch = prevJobs.find(lj => lj.id === cloudJob.id);
                                    const cloudFile = parseFileField(cloudJob.file);
                                    return {
                                        ...cloudJob,
                                        urgent: cloudJob.urgent === true || cloudJob.urgent === 'true',
                                        status: parseInt(cloudJob.status) || 1,
                                        createdAt: parseInt(cloudJob.createdAt) || Date.now(),
                                        // ถ้าระบบ Cloud ส่งไฟล์มาก็ใช้ของ Cloud ถ้าไม่มีให้รักษาไฟล์ในเครื่องไว้ไม่ให้หาย!
                                        file: cloudFile || (localMatch ? localMatch.file : null)
                                    };
                                });
                            });
                            setIsCloudConnected(true);
                        } else if (Array.isArray(fetchedJobs) && fetchedJobs.length === 0) {
                            setJobs([]);
                            setIsCloudConnected(true);
                        }
                    } catch (err) {
                        console.error("Sheets sync error:", err);
                        setIsCloudConnected(false);
                    }
                    setIsLoadingCloud(false);
                };

                const savedUrl = localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL;
                if (savedUrl && savedUrl.includes('script.google.com')) {
                    try {
                        if (!localStorage.getItem('vinylshop_gas_url')) {
                            localStorage.setItem('vinylshop_gas_url', savedUrl);
                        }
                    } catch (e) {}
                    setIsCloudConnected(true);
                    fetchFromSheets(savedUrl);
                    intervalId = setInterval(() => fetchFromSheets(savedUrl), 10000);
                } else {
                    try {
                        const savedLocalJobs = localStorage.getItem('vinylshop_local_jobs');
                        if (savedLocalJobs) setJobs(JSON.parse(savedLocalJobs));
                    } catch (e) {}
                    setIsLoadingCloud(false);
                }

                return () => {
                    if (intervalId) clearInterval(intervalId);
                };
            }, []);

            // เซฟลง LocalStorage สำรองไว้เสมอ
            useEffect(() => {
                try {
                    localStorage.setItem('vinylshop_local_jobs', JSON.stringify(jobs));
                } catch (e) {}
            }, [jobs]);

            // บีบอัดรูปภาพอัตโนมัติเพื่อให้เก็บลงช่อง Google Sheets ได้ (ไม่เกิน 45,000 ตัวอักษร) และเพื่อนดาวน์โหลดได้ทุกเครื่อง
            const compressImageForCloud = (fileObj) => {
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const MAX_DIM = 850;
                            if (width > height && width > MAX_DIM) {
                                height = Math.round(height * (MAX_DIM / width));
                                width = MAX_DIM;
                            } else if (height > MAX_DIM) {
                                width = Math.round(width * (MAX_DIM / height));
                                height = MAX_DIM;
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            let quality = 0.7;
                            let dataUrl = canvas.toDataURL('image/jpeg', quality);
                            while (dataUrl.length > 42000 && quality > 0.25) {
                                quality -= 0.15;
                                dataUrl = canvas.toDataURL('image/jpeg', quality);
                            }
                            resolve({
                                name: fileObj.name,
                                url: dataUrl,
                                size: fileObj.size,
                                isCloudReady: true,
                                type: 'image'
                            });
                        };
                        img.onerror = () => resolve(null);
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(fileObj);
                });
            };

            // อัปโหลดไฟล์เข้า Google Drive ร้านผ่าน Apps Script (สำหรับไฟล์ใหญ่ หรือ PDF/AI/PSD)
            const uploadFileToGoogleDrive = async (fileObj) => {
                const url = localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL;
                if (!url) return null;

                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const base64Content = e.target.result.split(',')[1];
                            const res = await fetch(url, {
                                method: 'POST',
                                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                body: JSON.stringify({
                                    action: 'uploadDrive',
                                    fileName: fileObj.name,
                                    mimeType: fileObj.type || 'application/octet-stream',
                                    base64: base64Content
                                })
                            });
                            const data = await res.json();
                            if (data && data.status === 'success') {
                                resolve({
                                    name: fileObj.name,
                                    url: data.downloadUrl || data.fileUrl,
                                    viewUrl: data.fileUrl,
                                    size: fileObj.size,
                                    isCloudReady: true,
                                    type: 'drive'
                                });
                            } else {
                                resolve(null);
                            }
                        } catch (err) {
                            console.error("Drive upload failed:", err);
                            resolve(null);
                        }
                    };
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(fileObj);
                });
            };

            // ระบบอัปโหลดไฟล์ขนาดใหญ่พิเศษ (100MB - 10GB) ตรงขึ้น Cloud Server พร้อมเปอร์เซ็นต์ความคืบหน้า
            const uploadLargeFileDirect = (fileObj, onProgress) => {
                return new Promise(async (resolve) => {
                    // Server 1: Gofile Cloud API (รองรับไฟล์ขนาดไม่จำกัด / 100MB - 10GB+ ฟรี)
                    try {
                        if (onProgress) onProgress(2, 'กำลังเตรียมเซิร์ฟเวอร์สำหรับไฟล์ขนาดใหญ่...');
                        let uploadUrl = 'https://upload.gofile.io/uploadfile';
                        try {
                            const srvRes = await fetch('https://api.gofile.io/servers');
                            const srvData = await srvRes.json();
                            if (srvData && srvData.status === 'ok' && srvData.data?.servers?.length > 0) {
                                uploadUrl = `https://${srvData.data.servers[0].name}.gofile.io/uploadfile`;
                            }
                        } catch (e) {}

                        const gofileResult = await new Promise((resUpload) => {
                            const xhr = new XMLHttpRequest();
                            const formData = new FormData();
                            formData.append('file', fileObj);

                            xhr.upload.onprogress = (event) => {
                                if (event.lengthComputable && onProgress) {
                                    const percent = Math.round((event.loaded / event.total) * 100);
                                    onProgress(percent, `กำลังอัปโหลดไฟล์ใหญ่ (${formatFileSize(event.loaded)} / ${formatFileSize(event.total)}) - ${percent}%`);
                                }
                            };

                            xhr.onload = () => {
                                try {
                                    const response = JSON.parse(xhr.responseText);
                                    if (response && response.status === 'ok' && response.data?.downloadPage) {
                                        resUpload({
                                            name: fileObj.name,
                                            url: response.data.downloadPage,
                                            viewUrl: response.data.downloadPage,
                                            size: fileObj.size,
                                            isCloudReady: true,
                                            type: 'large_cloud'
                                        });
                                    } else {
                                        resUpload(null);
                                    }
                                } catch (e) {
                                    resUpload(null);
                                }
                            };
                            xhr.onerror = () => resUpload(null);
                            xhr.open('POST', uploadUrl, true);
                            xhr.send(formData);
                        });

                        if (gofileResult) {
                            return resolve(gofileResult);
                        }
                    } catch (err) {
                        console.error('Primary large file cloud error:', err);
                    }

                    // Server 2 (สำรอง): Litterbox Direct Link (รองรับสูงสุด 1GB และกดลิงก์โหลดไฟล์ตรงได้ทันที)
                    if (fileObj.size <= 1024 * 1024 * 1024) {
                        try {
                            if (onProgress) onProgress(5, 'กำลังอัปโหลดผ่านเซิร์ฟเวอร์สำรองความเร็วสูง...');
                            const litterResult = await new Promise((resUpload) => {
                                const xhr = new XMLHttpRequest();
                                const formData = new FormData();
                                formData.append('reqtype', 'fileupload');
                                formData.append('time', '72h');
                                formData.append('fileToUpload', fileObj);

                                xhr.upload.onprogress = (event) => {
                                    if (event.lengthComputable && onProgress) {
                                        const percent = Math.round((event.loaded / event.total) * 100);
                                        onProgress(percent, `กำลังอัปโหลดไฟล์ตรง (${percent}%)`);
                                    }
                                };

                                xhr.onload = () => {
                                    if (xhr.status === 200 && xhr.responseText && xhr.responseText.startsWith('http')) {
                                        const directUrl = xhr.responseText.trim();
                                        resUpload({
                                            name: fileObj.name,
                                            url: directUrl,
                                            viewUrl: directUrl,
                                            size: fileObj.size,
                                            isCloudReady: true,
                                            type: 'direct_download'
                                        });
                                    } else {
                                        resUpload(null);
                                    }
                                };
                                xhr.onerror = () => resUpload(null);
                                xhr.open('POST', 'https://litterbox.catbox.moe/resources/internals/api.php', true);
                                xhr.send(formData);
                            });

                            if (litterResult) {
                                return resolve(litterResult);
                            }
                        } catch (err) {
                            console.error('Backup large file cloud error:', err);
                        }
                    }

                    resolve(null);
                });
            };

            // จัดการไฟล์แนบทุกขนาด (ตั้งแต่รูปเล็กไปจนถึงไฟล์งานพิมพ์ 100MB - 10GB)
            const processFileObject = async (fileObj, onProgress) => {
                if (!fileObj) return null;
                if (!(fileObj instanceof File)) return fileObj;

                const gasUrl = localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL;

                // 1. ถ้าเป็นไฟล์รูปภาพขนาดทั่วไป (< 15MB) ให้ทำทั้งย่อเก็บใน Sheets (ดูพรีวิวได้ทันที) และอัปโหลดตัวจริง
                if (fileObj.type.startsWith('image/') && fileObj.size <= 15 * 1024 * 1024) {
                    if (onProgress) onProgress(30, 'กำลังประมวลผลรูปภาพและซิงค์ขึ้น Cloud...');
                    if (gasUrl && fileObj.size <= 20 * 1024 * 1024) {
                        const driveRes = await uploadFileToGoogleDrive(fileObj);
                        if (driveRes) return driveRes;
                    }
                    const compressed = await compressImageForCloud(fileObj);
                    if (compressed) return compressed;
                }

                // 2. ถ้าไฟล์ขนาดไม่เกิน 20MB ลองส่งเข้า Google Drive ของร้านผ่าน Apps Script ก่อน
                if (gasUrl && fileObj.size <= 20 * 1024 * 1024) {
                    if (onProgress) onProgress(40, 'กำลังอัปโหลดไฟล์เข้า Google Drive ร้าน...');
                    const driveResult = await uploadFileToGoogleDrive(fileObj);
                    if (driveResult) return driveResult;
                }

                // 3. สำหรับไฟล์ขนาดใหญ่ (เช่น เกิน 20MB, 100MB, 500MB, 1GB+) ใช้ระบบ Direct Large File Cloud
                if (onProgress) onProgress(5, 'กำลังเริ่มต้นอัปโหลดไฟล์ขนาดใหญ่...');
                const largeCloudResult = await uploadLargeFileDirect(fileObj, onProgress);
                if (largeCloudResult) {
                    return largeCloudResult;
                }

                // 4. กรณีออฟไลน์จริงๆ เก็บไว้ในเครื่องชั่วคราว
                return {
                    name: fileObj.name,
                    url: URL.createObjectURL(fileObj),
                    size: fileObj.size,
                    isCloudReady: false
                };
            };

            // ส่งข้อมูลไปบันทึกที่ Google Sheets (POST) พร้อมส่งไฟล์แนบไปด้วย!
            const saveJobToCloud = async (jobData) => {
                const url = localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL;
                if (url) {
                    try {
                        const safeJobData = { ...jobData };
                        // ตรวจสอบขนาดข้อความของไฟล์ ถ้าไม่เกินลิมิต Google Sheets (48,000 ตัวอักษร) ให้ส่งขึ้น Cloud ไปด้วยเลย!
                        if (safeJobData.file) {
                            const fileStr = JSON.stringify(safeJobData.file);
                            if (fileStr.length > 48000) {
                                // ถ้าเกินลิมิตจริงๆ ค่อยส่งเฉพาะชื่อไฟล์และลิงก์
                                safeJobData.file = {
                                    name: safeJobData.file.name,
                                    url: safeJobData.file.viewUrl || safeJobData.fileLink || DEFAULT_SHOP_DRIVE_URL,
                                    isExternalLink: true
                                };
                            }
                        }
                        
                        await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'update', job: safeJobData })
                        });
                    } catch (err) {
                        console.error('Save to Sheets error:', err);
                    }
                }
            };

            // ลบข้อมูลบน Google Sheets
            const deleteJobFromCloud = async (jobId) => {
                const url = localStorage.getItem('vinylshop_gas_url') || DEFAULT_GAS_URL;
                if (url) {
                    try {
                        await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'delete', job: { id: jobId } })
                        });
                    } catch (err) {
                        console.error('Delete from Sheets error:', err);
                    }
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const name = formData.get('name')?.trim();
                const role = formData.get('role');
                if (name && role) {
                    setUser({ name, role });
                    showToast(`ยินดีต้อนรับ คุณ${name}`);
                }
            };

            const handleSaveJob = async (e) => {
                e.preventDefault();
                if (isSaving) return;
                if (!newJob.customer.trim() || !newJob.details.trim()) return;

                setIsSaving(true);
                setUploadProgress(0);
                setUploadStatusText('');

                const fileData = await processFileObject(newJob.file, (percent, statusTxt) => {
                    setUploadProgress(percent);
                    setUploadStatusText(statusTxt);
                });

                if (editingJob) {
                    const updatedJob = {
                        ...editingJob,
                        customer: newJob.customer,
                        phone: newJob.phone || '',
                        dueDate: newJob.dueDate || '',
                        price: newJob.price || '',
                        details: newJob.details,
                        urgent: newJob.urgent,
                        fileLink: (fileData && fileData.viewUrl) ? fileData.viewUrl : (newJob.fileLink || ''),
                        file: fileData !== null ? fileData : editingJob.file
                    };
                    setJobs(prev => prev.map(j => j.id === editingJob.id ? updatedJob : j));
                    await saveJobToCloud(updatedJob);
                    showToast('อัปเดตข้อมูลและซิงค์ไฟล์เรียบร้อยแล้ว');
                } else {
                    const nextNum = jobs.length > 0 ? Math.max(...jobs.map(j => parseInt(j.id.replace('JOB-', '')) || 100)) + 1 : 101;
                    const job = {
                        id: `JOB-${nextNum}`,
                        customer: newJob.customer,
                        phone: newJob.phone || '',
                        dueDate: newJob.dueDate || '',
                        price: newJob.price || '',
                        details: newJob.details,
                        status: 1,
                        createdBy: user.name,
                        date: new Date().toLocaleDateString('th-TH'),
                        file: fileData,
                        fileLink: (fileData && fileData.viewUrl) ? fileData.viewUrl : (newJob.fileLink || ''),
                        urgent: newJob.urgent,
                        createdAt: Date.now()
                    };
                    setJobs(prev => [job, ...prev]);
                    await saveJobToCloud(job);
                    showToast('สร้างรายการงานใหม่และอัปโหลดไฟล์สำเร็จ');
                }
                resetForm();
            };

            const handleStartEdit = (job) => {
                setEditingJob(job);
                setNewJob({
                    customer: job.customer || '',
                    phone: job.phone || '',
                    dueDate: job.dueDate || '',
                    price: job.price || '',
                    details: job.details || '',
                    file: job.file || null,
                    fileLink: job.fileLink || '',
                    urgent: job.urgent || false
                });
                setIsAddingJob(true);
            };

            const resetForm = () => {
                setIsAddingJob(false);
                setEditingJob(null);
                setNewJob({ customer: '', phone: '', dueDate: '', price: '', details: '', file: null, fileLink: shopDriveUrl, urgent: false });
                setIsSaving(false);
                setUploadProgress(0);
                setUploadStatusText('');
            };

            const handleDownloadHtmlApp = (fileName = 'index.html') => {
                const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`ดาวน์โหลดไฟล์ ${fileName} สำเร็จ!`);
            };

            const handleSaveGasUrl = () => {
                try {
                    if (!gasUrlInput.trim()) {
                        localStorage.setItem('vinylshop_gas_url', DEFAULT_GAS_URL);
                        setGasUrlInput(DEFAULT_GAS_URL);
                        showToast('รีเซ็ตกลับไปใช้ลิงก์หลักของร้านแล้ว', 'info');
                        setTimeout(() => window.location.reload(), 1200);
                        return;
                    }
                    if (gasUrlInput.includes('script.google.com') && gasUrlInput.endsWith('/exec')) {
                        localStorage.setItem('vinylshop_gas_url', gasUrlInput.trim());
                        showToast('บันทึก Web App URL สำเร็จ! กำลังโหลดใหม่...');
                        setTimeout(() => window.location.reload(), 1200);
                    } else {
                        showToast('URL ไม่ถูกต้อง ต้องมาจาก script.google.com และลงท้ายด้วย /exec', 'info');
                    }
                } catch (err) {
                    showToast('เกิดข้อผิดพลาดในการบันทึก URL', 'info');
                }
            };

            const handleDeleteJob = async (id) => {
                const target = jobs.find(j => j.id === id);
                if (target?.file?.url && target.file.url.startsWith('blob:')) {
                    URL.revokeObjectURL(target.file.url);
                }
                setJobs(jobs.filter(j => j.id !== id));
                await deleteJobFromCloud(id);
                setConfirmDeleteId(null);
                showToast('ลบรายการงานแล้ว', 'info');
            };

            // แนบไฟล์จากตารางหน้าหลัก (ปลดล็อกขนาดไฟล์ รองรับ 100MB - 10GB พร้อมเปอร์เซ็นต์อัปโหลด)
            const handleRowFileChange = async (jobId, e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                // รองรับสูงสุด 10GB
                if (file.size > 10 * 1024 * 1024 * 1024) {
                    setRowFileErrors(prev => ({ ...prev, [jobId]: 'รองรับขนาดไฟล์สูงสุดไม่เกิน 10GB' }));
                    e.target.value = null;
                    return;
                }
                setRowFileErrors(prev => ({ ...prev, [jobId]: '' }));
                setUploadingJobId(jobId);
                setUploadProgress(1);
                setUploadStatusText('กำลังเริ่มต้นอัปโหลด...');

                const fileData = await processFileObject(file, (percent, statusTxt) => {
                    setUploadProgress(percent);
                    setUploadStatusText(statusTxt);
                });

                const target = jobs.find(j => j.id === jobId);
                if (target && fileData) {
                    const updated = {
                        ...target,
                        file: fileData,
                        fileLink: fileData.viewUrl ? fileData.viewUrl : target.fileLink
                    };
                    setJobs(prev => prev.map(j => j.id === jobId ? updated : j));
                    await saveJobToCloud(updated);
                    showToast(fileData.isCloudReady ? `อัปโหลดไฟล์ (${formatFileSize(file.size)}) สำเร็จ! เพื่อนกดดาวน์โหลดได้เลย` : 'แนบไฟล์สำเร็จ');
                }
                setUploadingJobId(null);
                setUploadProgress(0);
                setUploadStatusText('');
            };

            const handleRemoveRowFile = async (jobId) => {
                const target = jobs.find(j => j.id === jobId);
                if (target?.file?.url && target.file.url.startsWith('blob:')) {
                    URL.revokeObjectURL(target.file.url);
                }
                if (target) {
                    const updated = { ...target, file: null };
                    setJobs(prev => prev.map(j => j.id === jobId ? updated : j));
                    await saveJobToCloud(updated);
                    showToast('ลบไฟล์แนบแล้ว', 'info');
                }
            };

            const handleExportBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jobs, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", `vinylshop_backup_${new Date().toISOString().slice(0,10)}.json`);
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();
                showToast('สำรองข้อมูลสำเร็จ');
            };

            const handleImportBackup = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedJobs = JSON.parse(event.target.result);
                        if (Array.isArray(importedJobs)) {
                            setJobs(importedJobs);
                            for (const item of importedJobs) {
                                if (item.id) await saveJobToCloud(item);
                            }
                            showToast(`นำเข้าสำเร็จ ${importedJobs.length} รายการ`);
                        }
                    } catch (err) {
                        showToast('ไฟล์สำรองข้อมูลไม่ถูกต้อง', 'info');
                    }
                };
                reader.readAsText(file);
                e.target.value = null;
            };

            const copyTextToClipboard = (text, msg = 'คัดลอกเรียบร้อยแล้ว') => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast(msg);
            };

            const canEditJob = (statusId, roleId) => {
                if (roleId === 'graphic') return [1, 2, 6, 7, 8, 9].includes(statusId);
                if (roleId === 'clerk') return [1, 2, 6, 7, 8].includes(statusId);
                if (roleId === 'production') return [3, 4, 5, 6].includes(statusId);
                return true;
            };

            if (!user) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-emerald-950 via-teal-900 to-slate-900 flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/20">
                            <div className="bg-emerald-600 p-8 text-center text-white relative">
                                <div className="w-16 h-16 bg-white/20 backdrop-blur-sm rounded-2xl flex items-center justify-center mx-auto mb-3">
                                    <i className="fas fa-scroll text-3xl"></i>
                                </div>
                                <h1 className="text-2xl font-bold">VinylShop Pro</h1>
                                <p className="text-emerald-100 text-sm mt-1">ระบบบริหารจัดการคิวงานร้านป้ายไวนิลครบวงจร</p>
                                <div className="mt-3 inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-700/60 text-emerald-100">
                                    <span className={`w-2 h-2 rounded-full mr-2 ${isCloudConnected ? 'bg-green-400 animate-pulse' : 'bg-yellow-400'}`}></span>
                                    {isLoadingCloud ? 'กำลังเชื่อมต่อฐานข้อมูล...' : isCloudConnected ? 'Cloud Online (ซิงค์ไฟล์ & ข้อมูล)' : 'Local Offline Mode'}
                                </div>
                            </div>
                            <div className="p-8">
                                <form onSubmit={handleLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1.5">ชื่อพนักงาน</label>
                                        <div className="relative">
                                            <i className="fas fa-user absolute left-3.5 top-3.5 text-gray-400"></i>
                                            <input type="text" name="name" required placeholder="เช่น แอน, บอย, ช่างเอก" className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1.5">เลือกฝ่าย / หน้าที่</label>
                                        <div className="relative">
                                            <i className="fas fa-id-badge absolute left-3.5 top-3.5 text-gray-400"></i>
                                            <select name="role" required className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                                <option value="">-- เลือกตำแหน่งงาน --</option>
                                                {ROLES.map(r => <option key={r.id} value={r.id}>{r.label}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center space-x-2">
                                        <span>เข้าสู่ระบบจัดการงาน</span>
                                        <i className="fas fa-arrow-right text-sm"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            const currentRoleObj = ROLES.find(r => r.id === user.role);
            const visibleStatuses = user.role === 'graphic' ? STATUSES : STATUSES.filter(s => s.id !== 9);
            const statusCounts = visibleStatuses.map(status => ({
                ...status,
                count: jobs.filter(job => job.status === status.id).length
            }));

            const filteredJobs = jobs.filter(job => {
                const matchStatus = statusFilter === null ? job.status !== 8 : job.status === statusFilter;
                const query = searchQuery.toLowerCase().trim();
                const matchSearch = !query || 
                    (job.customer && job.customer.toLowerCase().includes(query)) || 
                    (job.details && job.details.toLowerCase().includes(query)) ||
                    (job.id && job.id.toLowerCase().includes(query)) ||
                    (job.phone && job.phone.toLowerCase().includes(query)) ||
                    (job.createdBy && job.createdBy.toLowerCase().includes(query));
                return matchStatus && matchSearch;
            });

            return (
                <div className="min-h-screen bg-slate-50 pb-16">
                    {toast && (
                        <div className="fixed bottom-5 right-5 z-50 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 animate-bounce no-print">
                            <i className={`fas ${toast.type === 'info' ? 'fa-info-circle text-blue-400' : 'fa-check-circle text-emerald-400'}`}></i>
                            <span className="text-sm font-medium">{toast.message}</span>
                        </div>
                    )}

                    <nav className="bg-white border-b border-gray-200 sticky top-0 z-20 no-print">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
                            <div className="flex items-center space-x-3">
                                <div className="bg-emerald-600 w-10 h-10 rounded-xl flex items-center justify-center text-white shadow-sm">
                                    <i className="fas fa-print text-lg"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <span className="font-bold text-lg text-gray-900">VinylShop Pro</span>
                                        <span className={`inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold ${isCloudConnected ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}`}>
                                            <span className={`w-1.5 h-1.5 rounded-full mr-1 ${isCloudConnected ? 'bg-emerald-500 animate-ping' : 'bg-amber-500'}`}></span>
                                            {isCloudConnected ? 'Cloud Online' : 'Local Offline'}
                                        </span>
                                    </div>
                                    <span className="text-xs text-gray-500">ระบบติดตามคิวงานป้ายไวนิล</span>
                                </div>
                            </div>

                            <div className="flex items-center space-x-2 sm:space-x-3">
                                <a 
                                    href={shopDriveUrl}
                                    target="_blank"
                                    rel="noreferrer"
                                    title="เปิดโฟลเดอร์ Google Drive ของร้าน"
                                    className="text-xs bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-1.5 rounded-xl border border-blue-200 font-semibold transition flex items-center"
                                >
                                    <i className="fab fa-google-drive mr-1.5 text-sm"></i>
                                    <span className="hidden sm:inline">ไดรฟ์รวมไฟล์ร้าน</span>
                                    <span className="sm:hidden">Drive</span>
                                </a>

                                <button 
                                    onClick={() => { setSharingTab('cloud'); setIsSharingModalOpen(true); }}
                                    title="การตั้งค่า Cloud และการแชร์ไฟล์"
                                    className="text-xs bg-gray-900 text-white hover:bg-gray-800 px-3 py-1.5 rounded-xl font-semibold transition flex items-center"
                                >
                                    <i className="fas fa-cloud-arrow-up mr-1.5 text-sm text-emerald-400"></i>
                                    <span className="hidden sm:inline">ตั้งค่า Cloud / แชร์ไฟล์</span>
                                    <span className="sm:hidden">Cloud</span>
                                </button>

                                <div className="hidden xl:flex items-center space-x-1">
                                    <button onClick={handleExportBackup} title="สำรองข้อมูล" className="text-xs text-gray-600 hover:text-emerald-700 hover:bg-emerald-50 px-2.5 py-1.5 rounded-lg border transition flex items-center">
                                        <i className="fas fa-download mr-1.5"></i> สำรองข้อมูล
                                    </button>
                                    <button onClick={() => importInputRef.current?.click()} title="กู้คืนข้อมูล" className="text-xs text-gray-600 hover:text-blue-700 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg border transition flex items-center">
                                        <i className="fas fa-upload mr-1.5"></i> กู้คืน
                                    </button>
                                    <input ref={importInputRef} type="file" accept=".json" onChange={handleImportBackup} className="hidden" />
                                </div>

                                <div className="flex items-center bg-gray-100 px-3 py-1.5 rounded-xl border border-gray-200">
                                    <i className={`fas ${currentRoleObj?.icon} text-emerald-600 mr-2 text-sm`}></i>
                                    <div className="text-xs">
                                        <span className="font-semibold text-gray-800 mr-1">{user.name}</span>
                                        <select 
                                            value={user.role} 
                                            onChange={(e) => {
                                                setUser({ ...user, role: e.target.value });
                                                if (e.target.value !== 'graphic' && statusFilter === 9) setStatusFilter(null);
                                                showToast(`สลับมุมมองเป็น: ${ROLES.find(r => r.id === e.target.value)?.label.split(' ')[0]}`, 'info');
                                            }}
                                            className="bg-transparent font-medium text-emerald-700 outline-none cursor-pointer"
                                        >
                                            {ROLES.map(r => <option key={r.id} value={r.id}>{r.label.split(' ')[0]}</option>)}
                                        </select>
                                    </div>
                                </div>

                                <button onClick={() => setUser(null)} title="ออกจากระบบ" className="p-2 text-gray-500 hover:text-red-600 hover:bg-red-50 rounded-xl transition">
                                    <i className="fas fa-right-from-bracket text-lg"></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 no-print">
                        <div className="flex flex-col md:flex-row md:justify-between md:items-center gap-4 mb-6">
                            <div>
                                <h2 className="text-2xl font-bold text-gray-900">กระดานติดตามสถานะงาน</h2>
                                <p className="text-sm text-gray-500">แนบไฟล์รูปภาพหรือไฟล์งานเพื่อให้ทีมงานทุกเครื่องเปิดดูและกดดาวน์โหลดได้ทันที</p>
                            </div>
                            <div className="flex flex-col sm:flex-row gap-3">
                                <div className="relative">
                                    <i className="fas fa-search absolute left-3.5 top-3 text-gray-400 text-sm"></i>
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="ค้นหาชื่อลูกค้า, เบอร์โทร..." 
                                        className="pl-9 pr-8 py-2.5 bg-white border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none w-full sm:w-64"
                                    />
                                    {searchQuery && (
                                        <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-gray-400 hover:text-gray-600">
                                            <i className="fas fa-times-circle"></i>
                                        </button>
                                    )}
                                </div>
                                <button onClick={() => setIsAddingJob(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-sm transition flex items-center justify-center">
                                    <i className="fas fa-plus mr-2"></i> รับงานใหม่
                                </button>
                            </div>
                        </div>

                        <div className={`grid grid-cols-2 sm:grid-cols-4 ${user.role === 'graphic' ? 'lg:grid-cols-9' : 'lg:grid-cols-8'} gap-3 mb-8`}>
                            {statusCounts.map(status => {
                                const isSelected = statusFilter === status.id;
                                return (
                                    <div 
                                        key={status.id} 
                                        onClick={() => setStatusFilter(prev => prev === status.id ? null : status.id)}
                                        className={`bg-white rounded-2xl border p-3.5 flex flex-col items-center justify-center text-center cursor-pointer transition select-none ${
                                            isSelected ? 'ring-2 ring-emerald-600 border-emerald-600 bg-emerald-50/40 shadow-md -translate-y-0.5' : 'border-gray-200 hover:border-emerald-300'
                                        }`}
                                    >
                                        <div className={`w-10 h-10 rounded-xl flex items-center justify-center mb-2 ${status.color.split(' ')[0]} ${status.color.split(' ')[1]}`}>
                                            <i className={`fas ${status.icon} text-base`}></i>
                                        </div>
                                        <span className="text-2xl font-bold text-gray-900 leading-tight">{status.count}</span>
                                        <span className="text-xs font-medium text-gray-600 mt-1 line-clamp-1">{status.label}</span>
                                    </div>
                                );
                            })}
                        </div>

                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                            <div className="px-6 py-4 border-b border-gray-200 bg-gray-50/70 flex justify-between items-center">
                                <h3 className="text-base font-bold text-gray-800">
                                    <i className="fas fa-list-check mr-2 text-emerald-600"></i>
                                    {statusFilter === null ? 'รายการงานกำลังดำเนินการ (ไม่รวมจบงานแล้ว)' : `กรองสถานะ: ${STATUSES.find(s => s.id === statusFilter)?.label}`}
                                </h3>
                                {statusFilter !== null && (
                                    <button onClick={() => setStatusFilter(null)} className="text-xs font-medium text-emerald-600 hover:underline">
                                        แสดงทั้งหมด
                                    </button>
                                )}
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse min-w-[900px]">
                                    <thead>
                                        <tr className="bg-white border-b border-gray-200 text-xs uppercase tracking-wider text-gray-500">
                                            <th className="px-6 py-3.5 font-semibold w-1/4">รหัส / ลูกค้า</th>
                                            <th className="px-6 py-3.5 font-semibold w-2/5">สเปกงาน & ไฟล์สำหรับดาวน์โหลด</th>
                                            <th className="px-6 py-3.5 font-semibold">สถานะ</th>
                                            <th className="px-6 py-3.5 font-semibold text-right">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100 text-sm">
                                        {filteredJobs.length === 0 ? (
                                            <tr>
                                                <td colSpan="4" className="px-6 py-16 text-center text-gray-400">
                                                    <i className="fas fa-folder-open text-4xl mb-3 block text-gray-300"></i>
                                                    <p className="font-medium text-gray-600">ไม่พบรายการงาน</p>
                                                </td>
                                            </tr>
                                        ) : (
                                            filteredJobs.map(job => {
                                                const currentStatus = STATUSES.find(s => s.id === job.status) || STATUSES[0];
                                                const hasPermission = canEditJob(job.status, user.role);
                                                const isEditableStatus = [1, 2, 9].includes(job.status);
                                                const canAttachOrDeleteFile = isEditableStatus && hasPermission && user.role !== 'production';
                                                const isImageFile = job.file?.url && (job.file.url.startsWith('data:image') || /\.(jpg|jpeg|png|webp|gif)$/i.test(job.file.name || ''));

                                                return (
                                                    <tr key={job.id} className={`hover:bg-slate-50/80 transition-colors ${job.urgent ? 'bg-rose-50/20' : ''}`}>
                                                        <td className="px-6 py-4 align-top">
                                                            <div className="flex flex-wrap items-center gap-1.5 mb-1">
                                                                <span className="text-xs font-mono font-bold bg-gray-100 text-gray-700 px-2 py-0.5 rounded border">{job.id}</span>
                                                                {job.urgent && (
                                                                    <span className="bg-rose-100 text-rose-700 text-xs font-bold px-2 py-0.5 rounded-full">
                                                                        <i className="fas fa-fire mr-1"></i> ด่วน
                                                                    </span>
                                                                )}
                                                                {job.dueDate && (
                                                                    <span className="bg-amber-50 text-amber-800 border border-amber-200 text-[11px] font-medium px-2 py-0.5 rounded-full">
                                                                        นัด: {job.dueDate}
                                                                    </span>
                                                                )}
                                                            </div>
                                                            <div className="font-bold text-gray-900 text-base">{job.customer}</div>
                                                            {job.phone && <div className="text-xs text-emerald-700 font-medium mt-0.5"><i className="fas fa-phone mr-1"></i>{job.phone}</div>}
                                                            <div className="text-xs text-gray-400 mt-1">{job.date} • รับโดย: {job.createdBy}</div>
                                                        </td>

                                                        <td className="px-6 py-4 align-top text-gray-700">
                                                            <div className="mb-2 whitespace-pre-line leading-relaxed">{job.details}</div>
                                                            {job.price && <div className="text-xs font-semibold text-gray-600 mb-2">ราคา/มัดจำ: <span className="text-emerald-700">{job.price} บาท</span></div>}

                                                            <div className="flex flex-wrap items-center gap-2 mt-2">
                                                                {/* ลิงก์ Google Drive */}
                                                                {job.fileLink && (!job.file || job.fileLink !== job.file.viewUrl) && (
                                                                    <div className="inline-flex items-center gap-1.5 text-xs bg-blue-50 text-blue-800 px-3 py-1.5 rounded-xl border border-blue-200">
                                                                        <i className="fab fa-google-drive text-blue-600"></i>
                                                                        <a href={job.fileLink} target="_blank" rel="noreferrer" className="font-semibold text-blue-700 hover:underline truncate max-w-[180px]">
                                                                            {job.fileLink === DEFAULT_SHOP_DRIVE_URL ? 'โฟลเดอร์ Drive ร้าน' : 'เปิดลิงก์ไฟล์แนบ'}
                                                                        </a>
                                                                        <button onClick={() => copyTextToClipboard(job.fileLink, 'คัดลอกลิงก์แล้ว')} className="text-blue-600 hover:bg-blue-100 font-semibold px-1.5 py-0.5 bg-white rounded border text-[10px]">คัดลอก</button>
                                                                    </div>
                                                                )}

                                                                {/* แสดงแถบเปอร์เซ็นต์ขณะกำลังอัปโหลดไฟล์ใหญ่ */}
                                                                {uploadingJobId === job.id ? (
                                                                    <div className="w-full max-w-xs bg-emerald-50 border border-emerald-200 p-2.5 rounded-xl">
                                                                        <div className="flex justify-between items-center text-xs font-semibold text-emerald-800 mb-1">
                                                                            <span className="truncate"><i className="fas fa-spinner fa-spin mr-1.5"></i>{uploadStatusText || 'กำลังอัปโหลดไฟล์...'}</span>
                                                                            <span>{uploadProgress}%</span>
                                                                        </div>
                                                                        <div className="w-full bg-emerald-200 rounded-full h-2 overflow-hidden">
                                                                            <div className="bg-emerald-600 h-2 rounded-full transition-all duration-300" style={{ width: `${Math.max(5, uploadProgress)}%` }}></div>
                                                                        </div>
                                                                    </div>
                                                                ) : job.file ? (
                                                                    <div className="inline-flex items-center space-x-2.5 bg-emerald-50 border border-emerald-300 px-3.5 py-2 rounded-xl shadow-xs">
                                                                        {isImageFile && (
                                                                            <img 
                                                                                src={job.file.url} 
                                                                                alt={job.file.name} 
                                                                                onClick={() => setPreviewFile(job.file)}
                                                                                className="w-9 h-9 object-cover rounded-lg border border-emerald-300 cursor-pointer hover:opacity-80"
                                                                                title="คลิกเพื่อดูรูปขนาดใหญ่"
                                                                            />
                                                                        )}
                                                                        {!isImageFile && (
                                                                            <div className="w-9 h-9 rounded-lg bg-emerald-600 text-white flex items-center justify-center shrink-0">
                                                                                <i className="fas fa-file-zipper text-base"></i>
                                                                            </div>
                                                                        )}
                                                                        
                                                                        <div className="flex flex-col">
                                                                            <div className="flex items-center gap-1.5">
                                                                                <span className="text-emerald-950 font-bold text-xs truncate max-w-[170px]" title={job.file.name}>{job.file.name}</span>
                                                                                {job.file.size && (
                                                                                    <span className="text-[10px] bg-emerald-200/80 text-emerald-900 px-1.5 py-0.5 rounded font-semibold">
                                                                                        {formatFileSize(job.file.size)}
                                                                                    </span>
                                                                                )}
                                                                            </div>
                                                                            <div className="flex items-center gap-2 mt-1">
                                                                                {isImageFile && (
                                                                                    <button onClick={() => setPreviewFile(job.file)} className="text-[11px] bg-white text-blue-600 border border-blue-200 px-2 py-0.5 rounded-lg hover:bg-blue-50 font-semibold">
                                                                                        <i className="fas fa-eye mr-1"></i>ดูรูป
                                                                                    </button>
                                                                                )}
                                                                                <a 
                                                                                    href={job.file.url} 
                                                                                    download={job.file.name} 
                                                                                    target="_blank" 
                                                                                    rel="noreferrer" 
                                                                                    className="text-[11px] bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-0.5 rounded-lg font-bold flex items-center shadow-xs transition"
                                                                                >
                                                                                    <i className="fas fa-download mr-1"></i> กดดาวน์โหลดไฟล์
                                                                                </a>
                                                                            </div>
                                                                        </div>

                                                                        {canAttachOrDeleteFile && (
                                                                            <button onClick={() => handleRemoveRowFile(job.id)} title="ลบไฟล์แนบ" className="text-gray-400 hover:text-red-600 ml-1 pl-2 border-l border-emerald-200">
                                                                                <i className="fas fa-trash-can text-xs"></i>
                                                                            </button>
                                                                        )}
                                                                    </div>
                                                                ) : (
                                                                    canAttachOrDeleteFile && (
                                                                        <div>
                                                                            <label className="inline-flex items-center px-3 py-1.5 bg-white border border-dashed border-emerald-500 text-emerald-700 hover:bg-emerald-50 rounded-xl text-xs font-semibold cursor-pointer transition shadow-2xs">
                                                                                <i className="fas fa-cloud-arrow-up mr-1.5 text-emerald-600"></i> แนบไฟล์งาน (รองรับไฟล์ใหญ่ 100MB - 10GB)
                                                                                <input type="file" className="hidden" onChange={(e) => handleRowFileChange(job.id, e)} />
                                                                            </label>
                                                                            {rowFileErrors[job.id] && <p className="text-red-500 text-xs mt-1">{rowFileErrors[job.id]}</p>}
                                                                        </div>
                                                                    )
                                                                )}
                                                            </div>
                                                        </td>

                                                        <td className="px-6 py-4 align-top">
                                                            <select 
                                                                value={job.status} 
                                                                onChange={(e) => handleChangeStatus(job.id, parseInt(e.target.value))} 
                                                                disabled={!hasPermission}
                                                                className={`text-xs font-semibold px-3.5 py-2 rounded-xl border outline-none ${currentStatus.color} ${!hasPermission ? 'opacity-60 cursor-not-allowed' : 'cursor-pointer'}`}
                                                            >
                                                                {STATUSES.filter(s => s.id !== 9 || user.role === 'graphic' || job.status === 9).map(s => (
                                                                    <option key={s.id} value={s.id} className="bg-white text-gray-800 font-normal">{s.label}</option>
                                                                ))}
                                                            </select>
                                                        </td>

                                                        <td className="px-6 py-4 align-top text-right">
                                                            <div className="flex items-center justify-end space-x-1">
                                                                <button onClick={() => setPrintingJob(job)} title="พิมพ์ใบสั่งงาน" className="text-gray-400 hover:text-blue-600 p-2 rounded-lg">
                                                                    <i className="fas fa-print"></i>
                                                                </button>
                                                                {hasPermission && (
                                                                    confirmDeleteId === job.id ? (
                                                                        <div className="inline-flex items-center space-x-1 bg-red-50 p-1 rounded-xl">
                                                                            <button onClick={() => handleDeleteJob(job.id)} className="bg-red-600 text-white text-xs px-2 py-1 rounded">ลบ</button>
                                                                            <button onClick={() => setConfirmDeleteId(null)} className="text-gray-600 text-xs px-2 py-1">ยกเลิก</button>
                                                                        </div>
                                                                    ) : (
                                                                        <>
                                                                            <button onClick={() => handleStartEdit(job)} title="แก้ไข" className="text-gray-400 hover:text-emerald-600 p-2 rounded-lg"><i className="fas fa-pen-to-square"></i></button>
                                                                            <button onClick={() => setConfirmDeleteId(job.id)} title="ลบงาน" className="text-gray-400 hover:text-red-600 p-2 rounded-lg"><i className="fas fa-trash"></i></button>
                                                                        </>
                                                                    )
                                                                )}
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </main>

                    {/* Modal พรีวิวรูปภาพและดาวน์โหลด */}
                    {previewFile && (
                        <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center p-4 z-50" onClick={() => setPreviewFile(null)}>
                            <div className="bg-white rounded-3xl shadow-2xl max-w-2xl w-full overflow-hidden border" onClick={e => e.stopPropagation()}>
                                <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                                    <h3 className="font-bold text-gray-800 text-sm truncate">{previewFile.name}</h3>
                                    <button onClick={() => setPreviewFile(null)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-lg"></i></button>
                                </div>
                                <div className="p-6 bg-slate-900 flex justify-center items-center max-h-[70vh] overflow-auto">
                                    <img src={previewFile.url} alt={previewFile.name} className="max-w-full max-h-[60vh] object-contain rounded-lg shadow-lg" />
                                </div>
                                <div className="px-6 py-4 bg-gray-50 border-t flex justify-between items-center">
                                    <span className="text-xs text-emerald-700 font-medium">
                                        <i className="fas fa-cloud-check mr-1"></i> ซิงค์ข้อมูลพร้อมให้ทีมงานดาวน์โหลด
                                    </span>
                                    <div className="flex space-x-2">
                                        <a href={previewFile.url} download={previewFile.name} target="_blank" rel="noreferrer" className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center">
                                            <i className="fas fa-download mr-1.5"></i> ดาวน์โหลดไฟล์นี้
                                        </a>
                                        <button onClick={() => setPreviewFile(null)} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-xs font-bold">ปิด</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal เพิ่ม/แก้ไขงาน */}
                    {isAddingJob && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden border border-gray-100 my-8">
                                <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50">
                                    <h3 className="font-bold text-lg text-gray-900">
                                        {editingJob ? `แก้ไขงาน (${editingJob.id})` : 'เปิดใบงานใหม่'}
                                    </h3>
                                    <button onClick={resetForm} className="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full flex items-center justify-center">
                                        <i className="fas fa-times"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSaveJob} className="p-6 space-y-4">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ชื่องาน / ลูกค้า <span className="text-red-500">*</span></label>
                                            <input type="text" required value={newJob.customer} onChange={e => setNewJob({...newJob, customer: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border outline-none text-sm" placeholder="ร้านกาแฟสด" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรติดต่อ</label>
