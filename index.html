                                            <input type="text" value={newJob.phone} onChange={e => setNewJob({...newJob, phone: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border outline-none text-sm" placeholder="081-xxx-xxxx" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">วันนัดรับงาน</label>
                                            <input type="text" value={newJob.dueDate} onChange={e => setNewJob({...newJob, dueDate: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border outline-none text-sm" placeholder="พรุ่งนี้ 16:00 น." />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ราคา/มัดจำ (บาท)</label>
                                            <input type="text" value={newJob.price} onChange={e => setNewJob({...newJob, price: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border outline-none text-sm" placeholder="650" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-1">รายละเอียดสเปกงาน <span className="text-red-500">*</span></label>
                                        <textarea required rows="3" value={newJob.details} onChange={e => setNewJob({...newJob, details: e.target.value})} className="w-full px-3.5 py-2 rounded-xl border outline-none resize-none text-sm" placeholder="ขนาด, วัสดุ, ตาไก่..."></textarea>
                                    </div>
                                    <div className="flex items-center space-x-2">
                                        <input type="checkbox" id="urgentCheck" checked={newJob.urgent} onChange={e => setNewJob({...newJob, urgent: e.target.checked})} className="w-4 h-4 text-rose-600 rounded" />
                                        <label htmlFor="urgentCheck" className="text-sm font-medium text-gray-700 cursor-pointer">งานด่วนพิเศษ</label>
                                    </div>
                                    {user.role !== 'production' && (
                                        <div className="space-y-3 pt-3 border-t">
                                            <div className="bg-emerald-50/70 p-3.5 rounded-xl border border-emerald-200">
                                                <label className="block text-xs font-bold text-emerald-900 mb-1">
                                                    <i className="fas fa-cloud-arrow-up text-emerald-600 mr-1"></i> แนบไฟล์งานพิมพ์ / รูปภาพ (รองรับไฟล์ขนาดใหญ่ 100MB - 10GB)
                                                </label>
                                                <input type="file" onChange={e => setNewJob({...newJob, file: e.target.files[0]})} className="w-full text-xs bg-white border p-1.5 rounded-xl" />
                                                <p className="text-[11px] text-emerald-700 mt-1.5">
                                                    * ใส่ไฟล์ใหญ่ (.TIFF, .PSD, .AI, .PDF, .ZIP) ได้เลย ระบบจะอัปโหลดขึ้น Cloud อัตโนมัติเพื่อให้เพื่อนกดปุ่มดาวน์โหลดจากหน้าตารางได้ทันทีโดยไม่ต้องเข้า Google Drive
                                                </p>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-600 mb-1">
                                                    <i className="fab fa-google-drive text-blue-600 mr-1"></i> ลิงก์สำรอง (ถ้ามี)
                                                </label>
                                                <input type="text" value={newJob.fileLink} onChange={e => setNewJob({...newJob, fileLink: e.target.value})} placeholder="วางลิงก์เพิ่มเติม (ถ้ามี)..." className="w-full px-3.5 py-2 rounded-xl border outline-none text-xs" />
                                            </div>
                                        </div>
                                    )}

                                    {/* แสดงแถบความคืบหน้าเวลาอัปโหลดไฟล์ใหญ่ในหน้าต่างเปิดใบงาน */}
                                    {isSaving && uploadProgress > 0 && (
                                        <div className="bg-emerald-50 border border-emerald-200 p-3 rounded-xl">
                                            <div className="flex justify-between text-xs font-bold text-emerald-800 mb-1">
                                                <span>{uploadStatusText || 'กำลังอัปโหลดไฟล์ขนาดใหญ่...'}</span>
                                                <span>{uploadProgress}%</span>
                                            </div>
                                            <div className="w-full bg-emerald-200 rounded-full h-2.5 overflow-hidden">
                                                <div className="bg-emerald-600 h-2.5 rounded-full transition-all duration-300" style={{ width: `${Math.max(5, uploadProgress)}%` }}></div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="pt-4 flex space-x-3">
                                        <button type="button" onClick={resetForm} disabled={isSaving} className="flex-1 py-2.5 border rounded-xl hover:bg-gray-50 text-sm font-medium disabled:opacity-50">ยกเลิก</button>
                                        <button type="submit" disabled={isSaving} className="flex-1 py-2.5 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 text-sm font-medium shadow-md disabled:opacity-70 flex items-center justify-center">
                                            {isSaving ? <><i className="fas fa-spinner fa-spin mr-2"></i> กำลังอัปโหลดไฟล์ ({uploadProgress}%)...</> : 'บันทึกงาน'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal พิมพ์ใบงาน */}
                    {printingJob && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden border">
                                <div className="px-6 py-4 border-b flex justify-between items-center bg-gray-50 no-print">
                                    <h3 className="font-bold text-gray-800">ใบสั่งงาน (Job Order)</h3>
                                    <button onClick={() => setPrintingJob(null)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-xl"></i></button>
                                </div>
                                <div id="printable-area" className="p-8 space-y-4 bg-white text-gray-900">
                                    <div className="flex justify-between items-center border-b pb-4">
                                        <div>
                                            <h2 className="text-xl font-bold text-emerald-700">VinylShop Pro</h2>
                                            <p className="text-xs text-gray-500">ใบสั่งผลิตและควบคุมงานป้ายไวนิล</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="text-lg font-mono font-bold bg-gray-100 px-3 py-1 rounded">{printingJob.id}</span>
                                            {printingJob.urgent && <span className="block text-xs font-bold text-rose-600 mt-1">*** งานด่วนพิเศษ ***</span>}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 text-sm">
                                        <div><strong>ลูกค้า:</strong> {printingJob.customer}</div>
                                        <div><strong>เบอร์โทร:</strong> {printingJob.phone || '-'}</div>
                                        <div><strong>กำหนดนัดรับ:</strong> {printingJob.dueDate || '-'}</div>
                                        <div><strong>ราคา/มัดจำ:</strong> {printingJob.price ? `${printingJob.price} บาท` : '-'}</div>
                                    </div>
                                    <div className="border-t border-b py-3 text-sm">
                                        <strong className="block mb-1 text-gray-700">สเปก / รายละเอียดงาน:</strong>
                                        <div className="whitespace-pre-line bg-slate-50 p-3 rounded-xl border">{printingJob.details}</div>
                                    </div>
                                    {printingJob.file?.url && printingJob.file.url.startsWith('data:image') && (
                                        <div className="py-2 text-center">
                                            <p className="text-xs text-gray-500 mb-1">รูปตัวอย่างงานแนบ:</p>
                                            <img src={printingJob.file.url} alt="ตัวอย่างงาน" className="max-h-44 mx-auto border rounded-lg object-contain" />
                                        </div>
                                    )}
                                    <div className="text-xs text-gray-500 flex justify-between pt-2">
                                        <span>ออกใบงานโดย: {printingJob.createdBy} ({printingJob.date})</span>
                                        <span>ไฟล์แนบ: {printingJob.file ? printingJob.file.name : (printingJob.fileLink ? 'ดูใน Google Drive' : '-')}</span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-8 pt-8 text-center text-xs">
                                        <div className="border-t pt-2 border-gray-400">ผู้รับงาน / ออกแบบ</div>
                                        <div className="border-t pt-2 border-gray-400">ช่างผู้ผลิต / ตรวจสอบ</div>
                                    </div>
                                </div>
                                <div className="px-6 py-4 bg-gray-50 border-t flex justify-end space-x-2 no-print">
                                    <button onClick={() => window.print()} className="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-sm font-medium">
                                        <i className="fas fa-print mr-2"></i> พิมพ์ใบงาน
                                    </button>
                                    <button onClick={() => setPrintingJob(null)} className="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium">
                                        ปิด
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal ตั้งค่า Cloud / Google Sheets Code.gs / GitHub Pages */}
                    {isSharingModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden border my-8">
                                <div className="px-6 py-4 bg-gray-900 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-lg flex items-center">
                                        <i className="fas fa-cloud-arrow-up mr-2 text-emerald-400"></i> ตั้งค่าระบบแชร์ไฟล์ & Cloud
                                    </h3>
                                    <button onClick={() => setIsSharingModalOpen(false)} className="text-white/80 hover:text-white"><i className="fas fa-times text-xl"></i></button>
                                </div>

                                <div className="flex border-b bg-gray-50 px-6 pt-3 space-x-2">
                                    <button onClick={() => setSharingTab('cloud')} className={`px-4 py-2 text-xs font-bold rounded-t-xl border-t border-l border-r ${sharingTab === 'cloud' ? 'bg-white text-emerald-700' : 'text-gray-500'}`}>
                                        1. ตั้งค่า Google Sheets + โค้ดรับไฟล์
                                    </button>
                                    <button onClick={() => setSharingTab('drive')} className={`px-4 py-2 text-xs font-bold rounded-t-xl border-t border-l border-r ${sharingTab === 'drive' ? 'bg-white text-blue-700' : 'text-gray-500'}`}>
                                        2. Google Drive ร้าน
                                    </button>
                                    <button onClick={() => setSharingTab('github')} className={`px-4 py-2 text-xs font-bold rounded-t-xl border-t border-l border-r ${sharingTab === 'github' ? 'bg-white text-gray-900' : 'text-gray-500'}`}>
                                        3. อัปเดตขึ้น GitHub Pages
                                    </button>
                                </div>

                                <div className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                                    {sharingTab === 'cloud' && (
                                        <div className="space-y-4">
                                            <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h4 className="font-bold text-emerald-900 text-sm">
                                                        <i className="fas fa-code mr-1.5 text-emerald-600"></i> โค้ด Apps Script ใหม่ (รองรับการแนบไฟล์และอัปโหลดเข้า Drive อัตโนมัติ)
                                                    </h4>
                                                    <button 
                                                        onClick={() => copyTextToClipboard(GAS_CODE_TEMPLATE, 'คัดลอกโค้ด Code.gs เรียบร้อย!')}
                                                        className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shrink-0 shadow-sm"
                                                    >
                                                        <i className="fas fa-copy mr-1"></i> คัดลอกโค้ด Code.gs
                                                    </button>
                                                </div>
                                                <p className="text-xs text-emerald-800 mb-2">
                                                    เพื่อให้ไฟล์ที่แนบไม่หายและเพื่อนกดดาวน์โหลดได้ ให้คัดลอกโค้ดด้านล่างนี้ไปวางทับใน <strong>Extensions &gt; Apps Script</strong> ของ Google Sheets แล้วกด <strong>Deploy &gt; New deployment</strong> อีกครั้งครับ:
                                                </p>
                                                <pre className="bg-slate-900 text-emerald-300 p-3 rounded-xl text-[11px] font-mono overflow-x-auto max-h-40">
                                                    {GAS_CODE_TEMPLATE}
                                                </pre>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">วาง Web App URL ที่ได้จาก Apps Script (ลงท้ายด้วย /exec):</label>
                                                <textarea rows="2" value={gasUrlInput} onChange={e => setGasUrlInput(e.target.value)} placeholder='https://script.google.com/macros/s/..../exec' className="w-full p-3 text-xs font-mono bg-slate-900 text-emerald-400 rounded-xl border"></textarea>
                                                <div className="flex justify-end mt-2">
                                                    <button onClick={handleSaveGasUrl} className="px-4 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow-md hover:bg-emerald-700">
                                                        บันทึกและเชื่อมต่อ Google Sheets
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {sharingTab === 'drive' && (
                                        <div className="space-y-3">
                                            <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4">
                                                <h4 className="font-bold text-blue-900 text-sm mb-1"><i className="fab fa-google-drive mr-2 text-blue-600"></i> โฟลเดอร์ Google Drive กลางของร้าน</h4>
                                                <p className="text-xs text-blue-800 mb-3">สำหรับไฟล์งานพิมพ์ไวนิลขนาดใหญ่ (เช่น .AI, .PSD, .TIFF หลายร้อย MB) แนะนำให้อัปโหลดลงโฟลเดอร์นี้ หรือนำลิงก์มาวางในช่องลิงก์ของแต่ละใบงานครับ</p>
                                                <input type="text" value={shopDriveUrl} onChange={e => setShopDriveUrl(e.target.value)} className="w-full px-3 py-2 text-xs bg-white border border-blue-300 rounded-xl mb-2 font-mono" />
                                                <div className="flex gap-2">
                                                    <button onClick={() => copyTextToClipboard(shopDriveUrl)} className="px-3 py-1.5 bg-white text-blue-700 border rounded-xl text-xs font-semibold">คัดลอกลิงก์</button>
                                                    <a href={shopDriveUrl} target="_blank" rel="noreferrer" className="px-3 py-1.5 bg-blue-600 text-white rounded-xl text-xs font-semibold flex items-center">เปิดไดรฟ์ร้าน</a>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {sharingTab === 'github' && (
                                        <div className="space-y-4">
                                            <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                                                <div>
                                                    <h4 className="font-bold text-gray-900 text-sm">ดาวน์โหลดไฟล์ <code className="bg-white px-1 rounded text-emerald-700">index.html</code> เวอร์ชันอัปเกรด</h4>
                                                    <p className="text-xs text-gray-600 mt-0.5">นำไปอัปโหลดทับไฟล์เดิมบน GitHub เพื่อให้เพื่อนทุกคนได้ใช้ระบบแนบไฟล์ใหม่</p>
                                                </div>
                                                <button onClick={() => handleDownloadHtmlApp('index.html')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center shrink-0">
                                                    <i className="fas fa-download mr-2"></i> ดาวน์โหลด index.html
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="px-6 py-4 bg-gray-50 border-t flex justify-between items-center">
                                    <span className="text-xs text-gray-500">สถานะ: <strong className={isCloudConnected ? "text-emerald-600" : "text-amber-600"}>{isCloudConnected ? "Cloud Online (พร้อมซิงค์ไฟล์)" : "Local Mode"}</strong></span>
                                    <button onClick={() => setIsSharingModalOpen(false)} className="px-5 py-2 bg-gray-800 text-white rounded-xl text-sm font-medium">ปิดหน้าต่าง</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
